spring.application.name=BiasharaExpressBackend
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/biashara_express}
spring.datasource.username=${DB_USERNAME:biashara_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

